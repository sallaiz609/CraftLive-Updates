name: CraftLive Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Source checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: .NET 8 native helper compiler
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Test and build installer
        run: npm run dist:win

      - name: Save workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftLive-Windows-installer
          if-no-files-found: error
          path: |
            KESZ/CraftLive-Setup-*.exe
            KESZ/CraftLive-Setup-*.exe.blockmap
            KESZ/latest.yml

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match package version $package_version."
            exit 1
          fi
          notes_file="RELEASE_NOTES_${version}.md"
          assets=(
            KESZ/CraftLive-Setup-*.exe
            KESZ/CraftLive-Setup-*.exe.blockmap
            KESZ/latest.yml
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            if [[ -f "$notes_file" ]]; then
              gh release edit "$tag" --title "CraftLive ${version}" --notes-file "$notes_file" --latest
            else
              gh release edit "$tag" --title "CraftLive ${version}" --latest
            fi
          elif [[ -f "$notes_file" ]]; then
            gh release create "$tag" "${assets[@]}" --target main --title "CraftLive ${version}" --notes-file "$notes_file" --latest
          else
            gh release create "$tag" "${assets[@]}" --target main --title "CraftLive ${version}" --generate-notes --latest
          fi
