name: CraftLive Android 0.1.7 release

on:
  push:
    paths:
      - ".github/workflows/android-release-0.1.7.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release values
        shell: bash
        run: |
          VERSION="0.1.7"
          MANDATORY="true"
          VERSION_CODE="11007"
          echo "ANDROID_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_TAG=android-v$VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_MANDATORY=$MANDATORY" >> "$GITHUB_ENV"
          echo "ANDROID_APK_NAME=CraftLive-Android-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore release key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/craftlive-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/craftlive-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon test :app:assembleRelease
        working-directory: android

      - name: Prepare release files
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$ANDROID_APK_NAME"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${ANDROID_TAG}/${ANDROID_APK_NAME}"
          python3 android/scripts/make_android_manifest.py \
            "$ANDROID_VERSION_CODE" "$ANDROID_VERSION_NAME" \
            "$RUNNER_TEMP/$ANDROID_APK_NAME" "$APK_URL" \
            "$ANDROID_MANDATORY" "$RUNNER_TEMP/android-latest.json"

      - name: Publish Android GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$ANDROID_TAG" \
            "$RUNNER_TEMP/$ANDROID_APK_NAME" \
            "$RUNNER_TEMP/android-latest.json" \
            --target "$GITHUB_SHA" \
            --title "CraftLive Android $ANDROID_VERSION_NAME" \
            --notes-file android/release-notes/android-release.md \
            --latest=false

      - name: Publish updater manifest on main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/android-latest.json" android-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-latest.json
          git commit -m "Android updater manifest $ANDROID_VERSION_NAME" || true
          git push origin main

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftLive-Android-${{ env.ANDROID_VERSION_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.ANDROID_APK_NAME }}
            ${{ runner.temp }}/android-latest.json
