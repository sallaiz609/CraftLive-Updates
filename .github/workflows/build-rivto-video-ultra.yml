name: Build RIVTO Video Ultra APK

on:
  push:
    branches:
      - rivto-video-ultra-apk
    paths:
      - 'RIVTO-Video-Ultra-Android/**'
      - '.github/workflows/build-rivto-video-ultra.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: RIVTO-Video-Ultra-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p apk-out
          cp RIVTO-Video-Ultra-Android/app/build/outputs/apk/debug/app-debug.apk apk-out/RIVTO_Video_Ultra_v1.2.1.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RIVTO-Video-Ultra-v1.2.1-APK
          path: apk-out/RIVTO_Video_Ultra_v1.2.1.apk
          if-no-files-found: error
          retention-days: 30
